<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리끼리 난리 파티</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:linear-gradient(145deg,#fff5e8,#fce8f1 55%,#e9f3ff);color:#453c50;min-height:100vh}main{max-width:760px;margin:auto;padding:24px 16px}h1{font-size:clamp(26px,6vw,42px);margin:6px 0}p{line-height:1.5}.card{background:#ffffffd9;border:1px solid #fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 26px #9b89a51a}.hidden{display:none!important}input,button{font:inherit;border-radius:14px;padding:12px;border:1px solid #e4d9e7}input{width:100%;margin:7px 0;background:white}button{cursor:pointer;background:#8d75c8;color:white;border:0;font-weight:700;margin:5px 4px 5px 0}button.alt{background:#e9dff8;color:#5b467d}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.pill{display:inline-block;padding:6px 12px;border-radius:999px;background:#f4e8fa;margin:3px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.player{background:#f9f4ff;border-radius:14px;padding:12px}.big{font-size:30px;font-weight:800}.notice{min-height:24px;color:#bc5577;font-weight:700}.choice{font-size:19px;padding:18px;min-width:75px}.tiny{color:#81758d;font-size:13px}.</style></head><body><main>
<h1>🎉 우리끼리 난리 파티</h1><p>친구들과 각자 휴대폰으로 접속해서 플레이하는 온라인 파티 게임</p><p id="connection" class="pill">🔴 서버 연결 확인 중...</p>
<section id="home" class="card"><label>닉네임</label><input id="name" maxlength="14" placeholder="닉네임을 입력해줘"><div class="row"><button id="create">방 만들기</button><div><input id="code" maxlength="6" placeholder="방 코드 6자리"><button id="join" class="alt">방 참가하기</button></div></div><p class="tiny">방 하나에 최대 6명 · 5라운드 랜덤 게임</p></section>
<section id="lobby" class="card hidden"><h2>🏡 대기방 <span id="roomcode" class="pill"></span></h2><button id="copy" class="alt">방 코드 복사</button><div id="playerlist" class="players"></div><p id="hosthint" class="tiny"></p><button id="ready">준비 완료</button><button id="start" class="hidden">게임 시작</button></section>
<section id="game" class="card hidden"><h2 id="roundtitle">게임</h2><p id="rounddesc"></p><div id="gamearea"></div><p id="status" class="tiny"></p></section>
<section id="result" class="card hidden"><h2>🏁 라운드 결과</h2><div id="roundresult"></div><button id="next" class="hidden">다음 라운드</button></section>
<section id="final" class="card hidden"><h2>🏆 최종 순위</h2><div id="finalscore"></div><button onclick="location.reload()">다시하기</button></section><p id="notice" class="notice"></p></main>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io();let me='',roomCode='',host=false,roomState=null,currentGame=null,submitted=false;const $=id=>document.getElementById(id);function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}function notify(t){$('notice').textContent=t;setTimeout(()=>{if($('notice').textContent===t)$('notice').textContent=''},4000)}
$('create').onclick=()=>socket.emit('room:create',{name:$('name').value.trim()||'플레이어'});$('join').onclick=()=>socket.emit('room:join',{name:$('name').value.trim()||'플레이어',code:$('code').value.trim()});$('ready').onclick=()=>socket.emit('player:ready');$('start').onclick=()=>socket.emit('host:start');$('next').onclick=()=>socket.emit('host:next');$('copy').onclick=()=>navigator.clipboard?.writeText(roomCode).then(()=>notify('방 코드를 복사했어요!')).catch(()=>notify('방 코드: '+roomCode));
socket.on('room:joined',data=>{roomCode=data.code;roomState=data.room;host=roomState.hostId===socket.id;hide('home');show('lobby');$('roomcode').textContent=roomCode;renderRoom(roomState);notify('입장 성공! 친구에게 방 코드를 공유해줘.')});socket.on('room:update',r=>{roomState=r;host=r.hostId===socket.id;if(! $('lobby').classList.contains('hidden'))renderRoom(r)});socket.on('notice',notify);
function renderRoom(r){$('playerlist').innerHTML=r.players.map(p=>`<div class="player">🐻 <b>${esc(p.name)}</b><br>${p.ready?'✅ 준비 완료':'⏳ 대기'}<br>⭐ ${p.score}점</div>`).join('');$('hosthint').textContent=host?'방장입니다. 친구들이 들어오면 시작할 수 있어요.':'방장이 게임을 시작할 때까지 기다려주세요.';host?show('start'):hide('start');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
socket.on('game:start',d=>{currentGame=d.game;submitted=false;hide('result');hide('final');show('game');$('roundtitle').textContent=`${d.round}/${d.totalRounds} 라운드 · ${d.game.name}`;$('rounddesc').textContent=d.game.desc;$('status').textContent='아직 제출하지 않았어요.';renderGame(d)});
function renderGame(d){const area=$('gamearea');area.innerHTML='';if(d.game.type==='number'){area.innerHTML='<p>1부터 10까지 숫자 하나를 골라. 겹치면 점수 없어!</p>'+Array.from({length:10},(_,i)=>`<button class="choice" data-n="${i+1}">${i+1}</button>`).join('');area.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>submit(b.dataset.n));}
else if(d.game.type==='reaction'){area.innerHTML='<div class="big" id="signal">🟡 기다려…</div><button class="choice" id="tap" disabled>신호가 뜨면 누르기!</button>';socket.once('reaction:go',()=>{$('signal').textContent='🟢 지금!';$('tap').disabled=false;$('tap').textContent='지금 누르기!';$('tap').onclick=()=>submit('tap')});$('tap').onclick=()=>notify('신호 전에는 누를 수 없어요!');}
else if(d.game.type==='quiz'){const q=d.question;area.innerHTML=`<h3>${esc(q.q)}</h3>`+q.a.map((a,i)=>`<button class="choice" data-a="${i}">${esc(a)}</button>`).join('');area.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>submit(b.dataset.a));}
else if(d.game.type==='balance'){area.innerHTML='<h3>둘 중 하나를 선택해!</h3><button class="choice" data-b="A">🍰 A</button><button class="choice" data-b="B">🍕 B</button>';area.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>submit(b.dataset.b));}}
function submit(v){if(submitted)return;submitted=true;socket.emit('game:answer',v);$('status').textContent='제출 완료! 다른 친구들을 기다리는 중…';$('gamearea').querySelectorAll('button').forEach(b=>b.disabled=true)}
socket.on('round:result',res=>{show('result');$('roundresult').innerHTML=`<p><b>${esc(res.game.name)}</b> 결과 공개!</p><p>현재 점수</p>`+(roomState?.players||[]).slice().sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="player">${i+1}위 · ${esc(p.name)} · ${p.score}점</div>`).join('');host?show('next'):hide('next');});socket.on('game:final',list=>{hide('game');hide('result');show('final');$('finalscore').innerHTML=list.map((p,i)=>`<div class="player"><b>${i===0?'👑':i+1+'위'} ${esc(p.name)}</b> — ${p.score}점</div>`).join('')});
</script></body></html>
